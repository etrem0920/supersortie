name = "supersortie-api"
main = "worker.js"
compatibility_date = "2025-09-01"
routes = [{ pattern = "api.supersortie.io", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "dailydogfight"
database_id = "cee8cffa-1ebf-4e97-9662-19f4baf196ad"

# Posts to X three times a day (see x.js). Stays in draft mode until X_POSTING = "on" and the X keys are set.
[triggers]
crons = ["7 6 * * *", "7 14 * * *", "7 22 * * *"]

[vars]
ALLOWED_ORIGIN = "https://supersortie.io,https://www.supersortie.io,https://supersortie.pages.dev"

# Co-op rooms (one Durable Object per room code)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "CoopRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoopRoom"]

# Arena: free-for-all for up to 12 pilots (one Durable Object per arena, plus matchmaking)
[[durable_objects.bindings]]
name = "ARENAS"
class_name = "ArenaRoom"

[[durable_objects.bindings]]
name = "ARENA_DIR"
class_name = "ArenaDirectory"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ArenaRoom", "ArenaDirectory"]
